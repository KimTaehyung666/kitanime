<a href="/search?q={{ a.search_q | urlencode }}" class="acard" title="Cari &quot;{{ a.title }}&quot;">
    <img src="{{ a.cover }}" alt="{{ a.title }}" loading="lazy"
         onerror="this.src='https://via.placeholder.com/300x450/e5192c/fff?text=KN'">
    {% if a.type %}<span class="abadge badge-new">{{ a.type }}</span>{% endif %}
    <div class="acard-body">
        <div class="acard-title">{{ a.title }}</div>
        <div class="acard-meta">
            {% if a.score %}<span class="score"><i class="fas fa-star"></i> {{ a.score }}</span>{% endif %}
            {% if a.start_date %}<span>{{ a.start_date }}</span>{% endif %}
        </div>
    </div>
</a>
